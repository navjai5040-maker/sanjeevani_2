version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sanjeevani-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sanjeevani}
      POSTGRES_USER: ${POSTGRES_USER:-sanjeevani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local .env file before using the optional database stack}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sanjeevani-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
